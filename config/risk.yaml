# Polymarket Trading Bot - Risk Configuration
#
# This file defines risk limits and safeguards.
# ADJUST THESE CAREFULLY - they protect you from losses!

# =============================================================================
# ORDER LIMITS
# =============================================================================

# Maximum size for a single order (in shares/contracts)
max_order_size_per_token: 100

# Maximum total notional value of all open orders
# Calculated as: sum(price * size) for all open orders
max_total_open_notional: 1000

# =============================================================================
# EXPOSURE LIMITS
# =============================================================================

# Maximum net exposure per market
# This limits position size in any single market
max_net_exposure_per_market: 500

# Maximum total exposure across all positions
# This is your total capital at risk
max_total_exposure: 2000

# =============================================================================
# LOSS LIMITS (Circuit Breakers)
# =============================================================================

# Maximum daily loss before auto-halt
# If daily PnL drops below -$max_daily_loss, trading stops
max_daily_loss: 100

# Maximum drawdown from peak as a percentage (0.1 = 10%)
# If portfolio drops 10% from its peak, trading stops
max_drawdown_pct: 0.1

# =============================================================================
# QUOTE MANAGEMENT
# =============================================================================

# Minimum time between order updates (milliseconds)
# Prevents order spam and API rate limit issues
min_order_update_interval_ms: 1000

# Minimum price change to trigger order update
# If price change is smaller, don't update (reduces churn)
price_epsilon: 0.001

# =============================================================================
# NOTES
# =============================================================================
#
# These limits are enforced by the Risk Manager before orders are placed.
# If any limit would be exceeded, orders are rejected or scaled down.
#
# The kill switch can be triggered by:
# - Exceeding max_daily_loss
# - Exceeding max_drawdown_pct
# - Creating a file named "KILL_SWITCH" in the bot directory
# - Setting KILL_SWITCH=1 environment variable
#
# When triggered, ALL open orders are cancelled and trading stops.
#
# Start with conservative limits and increase gradually as you gain confidence.
