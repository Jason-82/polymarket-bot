# Polymarket Trading Bot - Strategy Configuration
#
# This file defines which strategies to run and their parameters.
# Strategies are modular and can be swapped without code changes.

strategies:
  # =============================================================================
  # MARKET MAKER STRATEGY
  # =============================================================================
  # Passive two-sided quoter that provides liquidity by quoting
  # bid and ask prices around the midpoint.
  #
  # WARNING: Market making is risky. You can lose money if:
  # - Prices move against you quickly (adverse selection)
  # - You accumulate too much inventory
  # - Spreads are too tight relative to volatility
  #
  - name: market_maker
    enabled: false  # Set to true to enable
    params:
      # Spread settings
      min_spread: 0.02      # Minimum 2 cent spread
      target_spread: 0.04   # Target 4 cent spread

      # Size settings
      quote_size: 10        # Quote size per side
      max_position: 100     # Max position before stopping

      # Inventory management
      inventory_skew: 0.001       # Price skew per share of inventory
      reduce_size_on_inventory: true

      # Quote management
      requote_threshold: 0.005    # Min change to requote

    # Tokens to quote (add token IDs here)
    tokens: []

  # =============================================================================
  # VALUE THRESHOLD STRATEGY
  # =============================================================================
  # Directional strategy that trades when prices deviate significantly
  # from a fair value estimate.
  #
  # By default, uses the current midpoint as "fair value" which means
  # it won't trade. You need to set fair_value_overrides or implement
  # a custom fair value model.
  #
  - name: value_threshold
    enabled: false
    params:
      # Threshold settings
      entry_threshold: 0.05   # 5 cent deviation to enter
      exit_threshold: 0.02    # 2 cent deviation to exit

      # Position sizing
      order_size: 20
      max_position: 100

      # Fair value settings
      use_midpoint_as_fair_value: false  # Set to false if using overrides

      # Manual fair value overrides
      # Map token_id -> your estimate of fair value (0-1)
      fair_value_overrides: {}
        # "0x123abc...": 0.65  # Your belief: 65% chance of YES

    tokens: []

  # =============================================================================
  # NEWS ALPHA STRATEGY (AI-Powered News Trading)
  # =============================================================================
  # Event-driven strategy that monitors news in real-time, uses Claude AI
  # to reason about market impact, and places trades faster than humans.
  #
  # EDGE: Speed + AI reasoning on second-order effects
  #
  # REQUIREMENTS:
  # - Twitter API bearer token (for real-time news)
  # - Claude API key (for reasoning)
  # - VPN connection (for Polymarket access)
  #
  # RISK DEFAULTS (for ~$100k allocated capital):
  # - $500 base order, scaling to $2k on high-confidence signals
  # - $5k max per market, $10k daily exposure cap
  # - 75% minimum confidence threshold
  #
  - name: news_alpha
    enabled: true   # <-- SET TO TRUE TO ACTIVATE
    params:
      # ----- API Keys (override in .env, not here) -----
      # twitter_bearer_token: ${TWITTER_BEARER_TOKEN}
      # claude_api_key: ${ANTHROPIC_API_KEY}

      # ----- News Sources -----
      enable_twitter: true          # Real-time tweets from key accounts
      enable_rss: true              # Backup from Reuters, AP, etc.
      twitter_poll_interval: 15     # Seconds between Twitter checks
      rss_poll_interval: 60         # Seconds between RSS checks

      # ----- LLM Reasoning -----
      llm_model: "claude-sonnet-4-20250514"   # Fast + smart
      llm_temperature: 0.3          # Lower = more consistent
      min_confidence: 75            # Only trade 75%+ confidence signals
      min_edge: 0.03                # Minimum 3 cent edge to trade

      # ----- Position Sizing (for ~$100k portfolio) -----
      base_order_size: 500          # $500 base bet
      max_order_size: 2000          # $2000 max per signal
      max_position_per_market: 5000 # $5k max exposure per market
      max_daily_exposure: 10000     # $10k total daily cap
      max_signals_per_day: 20       # Rate limit

      # ----- Timing -----
      max_news_age_seconds: 300     # Ignore news > 5 min old
      signal_cooldown_seconds: 60   # Min 1 min between trades on same market

      # ----- Focus Categories -----
      # Change these to shift focus (politics, world_events, economics, crypto, sports)
      enabled_categories:
        - politics
        - world_events
        - economics

    # Tokens: empty = trade all matching markets
    tokens: []

# =============================================================================
# HOW TO ADD A NEW STRATEGY
# =============================================================================
#
# 1. Create a new file in strategies/ (e.g., my_strategy.py)
# 2. Inherit from StrategyBase and implement on_tick() and get_risk_budget()
# 3. Register with @register_strategy("my_strategy")
# 4. Add configuration here with name: "my_strategy"
# 5. Set enabled: true and add tokens to trade
#
# Example:
#   - name: my_strategy
#     enabled: true
#     params:
#       my_param: 42
#     tokens:
#       - "0xabc..."
#       - "0xdef..."
