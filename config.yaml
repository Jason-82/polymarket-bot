# pm configuration. Everything here is hot-editable between runs; secrets live in .env.

venue: polymarket      # polymarket (international CLOB) | polymarket_us (CFTC-regulated, USD)
mode: paper            # read_only | paper | live

venue_us:
  ws_max_markets: 10   # the US venue caps streaming subscriptions; other markets are REST-polled
  book_poll_seconds: 5
  max_book_candidates: 120      # the venue lists no volume; we fetch books for this many pre-filtered markets
  max_event_details: 150        # since 2026-10-15 the events list shows one market per event; re-fetch this many
  maker_rebate_coef: 0          # from 2026-10-19 rebates are tiered: 0 below $10M/month maker volume
                                # (0.0035 at $10M+, 0.0070 at $50M+, 0.0104 at $200M+)
  timeout_seconds: 10           # market data / discovery requests
  order_timeout_seconds: 30     # order creation is never retried by the SDK; give it time
  max_retries: 1
  expand_timeout_seconds: 60    # cap on re-fetching full events during a universe refresh
  expand_concurrency: 8
  prefilter_max_spread: 0.15    # from the listing's quoted bid/ask, before fetching books
  prefilter_band: [0.05, 0.95]
  volume_poll_seconds: 60       # the venue's traded-volume counter for every market (REST bbo); 0 = off
  max_requests_per_second: 16   # all market-data REST calls together; the venue allows about 20/s per IP

record:                         # python -m pm --venue us record: watch many markets, trade nothing, for `measure`
  db_path: data/measure_{venue}.sqlite   # its own tape, never mixed with the paper bot's
  max_markets: 200              # watched at once, busiest events first (the venue lists events by volume)
  max_markets_per_event: 5      # one game lists many markets (winner, spreads, totals)
  max_events: 400               # events listed per universe refresh
  soon_days: 3                  # also list the busiest events starting within 3 days (games), interleaved
  exclude_tags: []              # sports included; e.g. [crypto] to leave a category out
  book_poll_seconds: 30         # REST book cadence: 200 books / 30 s + 200 counters / 60 s = 10 requests/s
  book_snapshot_seconds: 2      # changed books: rows at most every 2 s per token (|L and its mirror |S)...
  book_heartbeat_seconds: 60    # ...unchanged ones a row a minute: the tape grows about 0.5-1 GB a day
tick_seconds: 1.0      # strategy evaluation cadence
db_path: data/pm_{venue}.sqlite   # one tape per venue: data/pm_polymarket.sqlite, data/pm_polymarket_us.sqlite
log_level: INFO

universe:
  refresh_seconds: 600
  max_markets: 40               # how many markets to subscribe to
  min_liquidity_usd: 5000
  min_volume_24h_usd: 2000
  min_days_to_resolution: 2
  max_days_to_resolution: 120
  exclude_tags: [sports]        # sports/esports: highest taker fee, fastest tape; detected by tag or "X vs Y"
  include_neg_risk: true
  max_event_markets: 12         # complete neg-risk events only up to this many candidates
  prefer_rewards: true          # rank markets with a liquidity-rewards pool first (by $/day)
  min_reward_rate_per_day: 0    # e.g. 20 to ignore pools smaller than $20/day
  # Optional explicit list of condition IDs; when non-empty, filters above are ignored.
  condition_ids: []

risk:
  max_notional_per_market_usd: 40
  max_total_notional_usd: 200     # sum of |position cost| + resting order notional
  max_open_orders: 30
  daily_loss_limit_usd: 20        # realised + unrealised, resets at UTC midnight
  min_cash_reserve_usd: 20
  min_hours_to_resolution: 24     # no new maker orders inside this window
  kill_switch_file: KILL          # create this file to cancel everything and halt
  require_geoblock_ok_for_live: true

execution:
  requote_epsilon: 0.005          # don't replace a resting order for a smaller price move
  min_seconds_between_requotes: 10  # every replace loses queue position; be patient
  size_change_band: 0.25          # replace on size only if it differs by more than 25%
  taker_retry_seconds: 5
  paper_starting_cash_usd: 300
  paper_resume: true              # on restart, rebuild the paper portfolio from this venue's tape
  fill_poll_seconds: 2            # live: status poll cadence when the user feed is down
  reconcile_seconds: 20           # live: status poll cadence while the user feed is up

alerts:                           # Telegram; token and chat id live in .env
  feed_down_seconds: 60
  on_fills: true
  heartbeat_hours: 6

strategies:
  complete_set:
    enabled: true
    margin: 0.01                  # require cost < 1 - margin after fees
    max_legs_notional_usd: 30
    taker: true                   # this strategy takes; fee is included in the math
    venue_overrides:
      polymarket_us:              # one mirrored contract per market: YES ask + NO ask is always 1 + spread
        enabled: false

  maker:
    enabled: true
    quote_size_shares: 10
    half_spread: 0.02             # distance from fair on each side (before tick rounding)
    min_book_spread: 0.02         # don't quote into books already tighter than this
    max_book_spread: 0.15         # don't quote into broken/illiquid books
    min_depth_shares_at_touch: 50
    price_band: [0.10, 0.90]      # only quote when mid is inside this band
    max_inventory_shares: 40      # per token
    inventory_skew_per_share: 0.0005
    sell_inventory: true          # also post asks on tokens we hold (two-sided quote)
    stale_after_seconds: 15
    hold_within: 0.01             # keep an existing quote if the new target is within this (queue position)
    join_best: true               # if the book is tighter than half_spread, join the best price...
    min_half_spread: 0.01         # ...as long as it is still at least this far from fair
    venue_overrides:
      polymarket_us:              # one-tick books; from 2026-10-19 no maker rebate below $10M/month
        half_spread: 0.01
        min_half_spread: 0.005    # join the best bid only if it is >= half a cent below fair (+ any rebate):
                                  # true on 1-cent books, false on 0.1-cent books where joining earns ~nothing
        min_book_spread: 0.0
        min_depth_shares_at_touch: 20
        quote_size_shares: 20
    rewards_first: true           # in incentivised markets, quote inside the qualifying spread at qualifying size
    reward_spread_buffer: 0.005   # stay this far inside the max qualifying spread

  favorite_yield:
    enabled: false
    min_price: 0.95
    max_days_to_resolution: 14
    min_annualized_yield: 0.25
    size_shares: 10
