# Polymarket Trading Bot - Docker Compose
# Simple deployment configuration

version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polymarket-bot

    # Environment configuration
    environment:
      - BOT_MODE=${BOT_MODE:-READ_ONLY}
      - DATABASE_PATH=/app/data/polymarket.db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Secrets from .env file
      - PRIVATE_KEY=${PRIVATE_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}

    # Persist data
    volumes:
      - polymarket-data:/app/data
      - ./config:/app/config:ro
      - ./logs:/app/logs

    # Restart policy
    restart: unless-stopped

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

    # Logging
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  polymarket-data:
    driver: local
