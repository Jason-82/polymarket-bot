[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pm"
version = "2.0.0"
description = "Polymarket maker-first trading bot with paper/live parity and full tape recording"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=12",
    "pyyaml>=6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
live = ["py-clob-client-v2>=1.1.0"]
us = ["polymarket-us>=0.1.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
pm = "pm.__main__:main"

[tool.setuptools.packages.find]
include = ["pm*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
